name: Astro Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: engine
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv sync --locked --extra dev

    - name: Parse Python sources
      working-directory: engine
      run: uv run python -m compileall -q src tests

    - name: Lint with Ruff
      working-directory: engine
      run: uv run ruff check src/astro_engine src/astro_cli tests

    - name: Type check with mypy
      working-directory: engine
      run: uv run mypy src/astro_engine src/astro_cli

    - name: Build wheel
      working-directory: engine
      run: uv build --wheel --out-dir "$RUNNER_TEMP/astro-m1-wheel"

    - name: Run test suite with pytest
      working-directory: engine
      run: |
        uv run python -m pytest -q \
          -o cache_dir=/tmp/astro-m1-pytest-cache \
          --cov=astro_engine \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml:"$RUNNER_TEMP/astro-m1-coverage.xml"

    - name: Inspect wheel package boundary
      working-directory: engine
      run: |
        ASTRO_WHEEL="$(ls "$RUNNER_TEMP"/astro-m1-wheel/*.whl)" \
          uv run python -m pytest -q tests/test_package_boundary.py

    - name: Smoke test installed wheel
      working-directory: engine
      run: |
        ASTRO_WHEEL="$(ls "$RUNNER_TEMP"/astro-m1-wheel/*.whl)"
        uv pip install --python .venv/bin/python --force-reinstall --no-deps "$ASTRO_WHEEL"
        .venv/bin/astro --version
        .venv/bin/astro list-methods

    - name: Check installed dependencies
      working-directory: engine
      run: uv pip check --python .venv/bin/python
